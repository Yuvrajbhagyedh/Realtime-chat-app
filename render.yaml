databases:
  - name: relay-db
    plan: free

services:
  - type: redis
    name: relay-redis
    plan: free
    ipAllowList: []

  - type: web
    name: relay-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: relay-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST
        value: /frontend/dist
      - key: UPLOAD_DIR
        value: /app/uploads
