services:
  - type: web
    name: relay-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/chat.db
      - key: REDIS_URL
        value: memory://
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST
        value: /frontend/dist
      - key: UPLOAD_DIR
        value: /app/uploads
